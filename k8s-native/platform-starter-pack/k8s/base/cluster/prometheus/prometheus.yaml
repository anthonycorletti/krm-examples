alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
global:
  scrape_interval: 15s
rule_files:
- /etc/platform/alerts.yaml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: otel
  static_configs:
  - targets:
    - otel-collector:8889
- job_name: envoy-gateway
  static_configs:
  - targets:
    - envoy-gateway:19001
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
- job_name: platform-api
  static_configs:
  - targets:
    - platform-api.platform-apps.svc.cluster.local:8000
