apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-acme
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.invalid
    privateKeySecretRef:
      name: platform-acme-account
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: platform
            namespace: platform-cluster
            kind: Gateway
            sectionName: http
