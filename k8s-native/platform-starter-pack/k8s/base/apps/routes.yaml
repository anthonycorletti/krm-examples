apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-web
spec:
  parentRefs:
  - name: platform
    namespace: platform-cluster
    sectionName: https
  hostnames:
  - web.example.invalid
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: platform-api
      port: 8000
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: platform-web
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
