apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-inspection
rules:
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  resourceNames: [platform-api]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-inspection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-inspection
subjects:
- kind: ServiceAccount
  name: platform-observer
- kind: ServiceAccount
  name: platform-workflow
