apiVersion: batch/v1
kind: Job
metadata:
  name: platform-migrate
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: platform-migrate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: platform-server
        command:
        - /srv/.venv/bin/alembic
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: platform-settings
        env:
        - name: APP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: platform-postgres-app
              key: fqdn-uri
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: postgres-ca
          mountPath: /run/postgres
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: postgres-ca
        secret:
          secretName: platform-postgres-ca
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
