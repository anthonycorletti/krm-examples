apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-mcp
  template:
    metadata:
      labels:
        app: platform-mcp
    spec:
      serviceAccountName: platform-observer
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mcp
        image: platform-server
        command:
        - /srv/.venv/bin/uvicorn
        - app.mcp:create_http_app
        - --host
        - 0.0.0.0
        - --port
        - '8001'
        - --factory
        envFrom:
        - configMapRef:
            name: platform-settings
        - secretRef:
            name: platform-storage
        env:
        - name: APP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: platform-postgres-app
              key: fqdn-uri
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: postgres-ca
          mountPath: /run/postgres
          readOnly: true
        - name: tmp
          mountPath: /tmp
        ports:
        - containerPort: 8001
          name: http
        readinessProbe:
          tcpSocket:
            port: http
        livenessProbe:
          tcpSocket:
            port: http
        startupProbe:
          tcpSocket:
            port: http
          failureThreshold: 30
          periodSeconds: 5
      volumes:
      - name: postgres-ca
        secret:
          secretName: platform-postgres-ca
      - name: tmp
        emptyDir: {}
