[project]
name = "platform-starter-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "sqlmodel==0.0.42",
  "alembic==1.19.2",
  "asyncpg==0.31.0",
  "pydantic-settings==2.15.0",
  "fastmcp==2.14.7",
  "pydantic-ai-slim[anthropic,openai]==1.107.5",
  "pyjwt[crypto]==2.13.0",
  "sqlalchemy[asyncio]==2.0.52",
  "httpx==0.28.1",
  "python-ulid==4.0.1",
  "aiobotocore==3.9.1",
  "redis==8.1.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "prometheus-client==0.26.0",
]
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.6",
    "ty==0.0.78",
    "cryptography==50.0.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
